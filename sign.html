<script>
const SUPABASE_URL = 'https://lnwikmhtaqkqsjrngrlg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxud2lrbWh0YXFrcXNqcm5ncmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjAxNDMsImV4cCI6MjA4OTMzNjE0M30.BqTG6vtVvjQFKiiT5_quCn9RFw2TdIMwpi5LqFlC8O0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const token = new URLSearchParams(window.location.search).get('token');
const protocolToken = new URLSearchParams(window.location.search).get('protocol');
let resData = null, vpProfile = null, protoData = null;
let canvas, ctx, drawing = false;

function fmt(n) {
  if (!n) return '—';
  return '€\u00a0' + Math.round(n).toLocaleString('de-DE');
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'});
}

async function load() {
  // ── Beratungsprotokoll mode ──────────────────────────────────────────────
  if (protocolToken) {
    document.querySelector('.header-title').textContent = 'Beratungsprotokoll';
    document.getElementById('headerLogo').innerHTML = '<span class="vw">Vestora<span class="dot"></span></span>';
    await loadProtocol();
    return;
  }

  // ── Reservierungsvereinbarung mode ───────────────────────────────────────
  if (!token) {
    document.getElementById('main').innerHTML = '<div class="error-box">Ungültiger Link – kein Token gefunden.</div>';
    return;
  }

  const { data: r } = await sb.from('reservations')
    .select('*, objects(name,address,price_unit,price_furniture,parking_active,parking_price,bank_name,bank_iban,bank_bic,bank_account_holder)')
    .eq('signing_token', token)
    .single();

  if (!r) {
    document.getElementById('main').innerHTML = '<div class="error-box">Vereinbarung nicht gefunden. Bitte kontaktieren Sie Ihren Ansprechpartner.</div>';
    return;
  }

  if (r.signed_at) {
    document.getElementById('main').innerHTML = showSuccess(r);
    return;
  }

  resData = r;

  // Token-Ablauf prüfen
  // Die 72h-Soft-Frist (expires_at) gilt nur für die interne Prüfung vor
  // der Genehmigung. Ist die Reservierung genehmigt, zählt hard_expires_at.
  const now = new Date();
  if (r.status !== 'approved' && r.expires_at && new Date(r.expires_at) < now) {
    document.getElementById('main').innerHTML = '<div class="error-box">Dieser Link ist abgelaufen. Bitte kontaktieren Sie Ihren Ansprechpartner für einen neuen Link.</div>';
    return;
  }
  if (r.hard_expires_at && new Date(r.hard_expires_at) < now) {
    document.getElementById('main').innerHTML = '<div class="error-box">Die Reservierungsfrist ist abgelaufen. Bitte kontaktieren Sie Ihren Ansprechpartner.</div>';
    return;
  }

  const o = r.objects || {};
  const totalKP = (o.price_unit||0) + (o.price_furniture||0) + (o.parking_active ? (o.parking_price||0) : 0);
  const hardExpiry = r.hard_expires_at ? new Date(r.hard_expires_at) : null;
  const paymentDeadline = new Date(Date.now() + 5*24*60*60*1000);

  if (r.vp_id) {
    const { data: vp } = await sb.from('profiles').select('company_name,company_logo,full_name,email,phone').eq('id', r.vp_id).single();
    vpProfile = vp;
  }

  // Header-Logo dynamisch setzen
  const headerLogo = document.getElementById('headerLogo');
  if (headerLogo && vpProfile?.company_name) {
    headerLogo.textContent = vpProfile.company_name;
  }

  const preEmail = r.buyer_email || (r.buyer_contact && r.buyer_contact.includes('@') ? r.buyer_contact : '');

  document.getElementById('main').innerHTML = `
    ${vpProfile && (vpProfile.company_name || vpProfile.company_logo) ? `
    <div class="vp-brand">
      ${vpProfile.company_logo ? `<img src="${vpProfile.company_logo}" alt="Logo">` : ''}
      <div>
        <div class="vp-brand-label">Präsentiert durch</div>
        <div class="vp-brand-name">${vpProfile.company_name || vpProfile.full_name}</div>
      </div>
    </div>` : ''}

    <div class="doc">
      <div class="doc-title">Reservierungsvereinbarung</div>
      <div class="doc-sub">Datum: ${fmtDate(new Date().toISOString())} · Vorgangsnummer: ${token.slice(0,8).toUpperCase()}</div>

      <div class="section">
        <div class="section-title">Objekt</div>
        <div class="row"><span>Wohneinheit</span><span>${o.name||'—'}</span></div>
        <div class="row"><span>Adresse</span><span>${o.address||'—'}</span></div>
        <div class="row"><span>Kaufpreis</span><span>${fmt(totalKP)}</span></div>
      </div>

      <div class="section">
        <div class="section-title">Käufer</div>
        <div class="row"><span>Name</span><span>${r.buyer_name||'—'}</span></div>
        ${r.buyer_contact ? `<div class="row"><span>Kontakt</span><span>${r.buyer_contact}</span></div>` : ''}
      </div>

      ${vpProfile ? `
      <div class="section">
        <div class="section-title">Vermittler</div>
        <div class="row"><span>Name</span><span>${vpProfile.full_name||'—'}</span></div>
        ${vpProfile.company_name ? `<div class="row"><span>Unternehmen</span><span>${vpProfile.company_name}</span></div>` : ''}
        <div class="row"><span>E-Mail</span><span>${vpProfile.email||'—'}</span></div>
      </div>` : ''}

      <div class="section">
        <div class="section-title">Reservierungskonditionen</div>
        <div class="highlight">
          <strong>① Reservierung:</strong> Einheit ist ab sofort für Sie reserviert.<br>
          <strong>② Finalisierung Finanzierung:</strong> Nach Genehmigung – Frist bis <strong>${hardExpiry ? fmtDate(hardExpiry.toISOString()) : fmtDate(new Date(Date.now()+21*24*60*60*1000).toISOString())}</strong> (21 Tage).<br>
          <strong>③ Beurkundung:</strong> Finaler Abschluss beim Notar.<br>
          <strong>Reservierungsgebühr: € 1.000,00</strong> – Zahlungsfrist bis <strong>${fmtDate(paymentDeadline.toISOString())}</strong>.<br>
          <span style="font-size:12px;color:#666">Die Gebühr verfällt bei Rücktritt des Käufers. Erstattung binnen 5 Werktagen nach Beurkundung, bei Rücktritt des Verkäufers, oder wenn trotz vollständiger Unterlagen die Finanzierung nicht innerhalb von 21 Tagen steht.</span>
        </div>
      </div>

      ${o.bank_iban ? `
      <div class="section">
        <div class="section-title">Zahlungsanweisung Reservierungsgebühr</div>
        <div class="bank-box">
          <div class="label">Empfänger</div>
          <div class="value">${o.bank_account_holder||'—'}</div>
          <div class="label">Bank</div>
          <div class="value">${o.bank_name||'—'}</div>
          <div class="label">IBAN</div>
          <div class="value">${o.bank_iban}</div>
          ${o.bank_bic ? `<div class="label">BIC</div><div class="value">${o.bank_bic}</div>` : ''}
          <div class="label">Verwendungszweck</div>
          <div class="value">Reservierung ${o.name||''} – ${r.buyer_name}</div>
          <div class="label">Betrag</div>
          <div class="value" style="color:#6fcf97">€ 1.000,00</div>
        </div>
      </div>` : ''}

      <div class="section">
        <div class="section-title">Rechtliche Hinweise</div>
        <div class="legal">
          Diese Reservierungsvereinbarung begründet kein verbindliches Kaufversprechen und ersetzt nicht den notariellen Kaufvertrag.
          Die Reservierung kann durch beide Parteien schriftlich widerrufen werden. Bei Widerruf durch den Käufer innerhalb der
          Reservierungsfrist verfällt die Reservierungsgebühr. Der Verkäufer behält sich das Recht vor, die
          Reservierung bei Nichtzahlung der Reservierungsgebühr innerhalb der Zahlungsfrist zu stornieren.
          Mit Unterzeichnung bestätigt der Käufer, diese Vereinbarung gelesen und verstanden zu haben.
        </div>
      </div>
    </div>

    <div class="sign-area">
      <div class="sign-title">Digitale Unterschrift</div>
      <div class="sign-sub">Bitte im folgenden Feld mit dem Finger oder der Maus unterschreiben:</div>

      <canvas id="sigCanvas" width="700" height="160"></canvas>
      <div class="sign-actions">
        <button class="btn-clear" onclick="clearSig()">↺ Löschen</button>
        <button class="btn-submit" id="submitBtn" onclick="submitSignature()">✓ Verbindlich unterzeichnen &amp; PDF herunterladen</button>
      </div>
      <div id="progress" class="progress"></div>
      <div style="font-size:11px;color:#888;margin-top:10px">
        Mit der Unterzeichnung bestätigen Sie die obige Reservierungsvereinbarung.<br>
        Ihre Unterschrift, IP-Adresse und der Zeitstempel werden gespeichert.
      </div>
    </div>
  `;

  initCanvas();
}

function initCanvas() {
  canvas = document.getElementById('sigCanvas');
  if (!canvas) return;
  ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1F2A24';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  canvas.addEventListener('mousedown', e => { drawing = true; ctx.beginPath(); const r = canvas.getBoundingClientRect(); ctx.moveTo((e.clientX-r.left)*(canvas.width/r.width), (e.clientY-r.top)*(canvas.height/r.height)); });
  canvas.addEventListener('mousemove', e => { if(!drawing) return; const r = canvas.getBoundingClientRect(); ctx.lineTo((e.clientX-r.left)*(canvas.width/r.width), (e.clientY-r.top)*(canvas.height/r.height)); ctx.stroke(); });
  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('mouseleave', () => drawing = false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; ctx.beginPath(); const r = canvas.getBoundingClientRect(), t = e.touches[0]; ctx.moveTo((t.clientX-r.left)*(canvas.width/r.width), (t.clientY-r.top)*(canvas.height/r.height)); });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!drawing) return; const r = canvas.getBoundingClientRect(), t = e.touches[0]; ctx.lineTo((t.clientX-r.left)*(canvas.width/r.width), (t.clientY-r.top)*(canvas.height/r.height)); ctx.stroke(); });
  canvas.addEventListener('touchend', () => drawing = false);
}

function clearSig() {
  if (canvas && ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function isCanvasEmpty() {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  return !data.some(v => v !== 0);
}

function setProgress(msg) {
  const el = document.getElementById('progress');
  if (el) el.textContent = msg;
}

function generatePDF(r, sigData) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const o = r.objects || {};
  const totalKP = (o.price_unit||0) + (o.price_furniture||0) + (o.parking_active ? (o.parking_price||0) : 0);
  const W = 210, margin = 20;
  let y = 20;

  // Header – VP-Firmenname wenn vorhanden, sonst neutral
  const headerName = vpProfile?.company_name || 'Vestora';
  doc.setFillColor(26, 39, 68);
  doc.rect(0, 0, W, 28, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.setTextColor(212, 175, 74);
  doc.text(headerName, margin, 13);
  doc.setFontSize(9);
  doc.setTextColor(180, 180, 200);
  doc.text('RESERVIERUNGSVEREINBARUNG', margin, 21);
  y = 38;

  // Title
  doc.setTextColor(26, 39, 68);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text('Reservierungsvereinbarung', margin, y);
  y += 7;
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(120, 120, 120);
  doc.text('Datum: ' + fmtDate(new Date().toISOString()) + '   ·   Vorgangsnummer: ' + token.slice(0,8).toUpperCase(), margin, y);
  y += 10;

  function section(title) {
    doc.setFillColor(240, 242, 247);
    doc.rect(margin, y, W-2*margin, 6, 'F');
    doc.setFontSize(8);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(100, 100, 120);
    doc.text(title.toUpperCase(), margin+2, y+4.2);
    y += 9;
  }
  function row(label, value) {
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(100, 100, 100);
    doc.text(label, margin, y);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(26, 39, 68);
    doc.text(String(value||'—'), W/2, y);
    doc.setDrawColor(230, 230, 230);
    doc.line(margin, y+1.5, W-margin, y+1.5);
    y += 7;
  }

  section('Objekt');
  row('Wohneinheit', o.name||'—');
  row('Adresse', o.address||'—');
  row('Kaufpreis', fmt(totalKP));
  y += 3;

  section('Käufer');
  row('Name', r.buyer_name||'—');
  if (r.buyer_contact) row('Kontakt', r.buyer_contact);
  y += 3;

  if (vpProfile) {
    section('Vermittler');
    row('Name', vpProfile.full_name||'—');
    if (vpProfile.company_name) row('Unternehmen', vpProfile.company_name);
    row('E-Mail', vpProfile.email||'—');
    y += 3;
  }

  section('Reservierungskonditionen');
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(50, 50, 50);
  const lines = [
    'Soft-Reservierung: Einheit reserviert bis ' + fmtDate(r.expires_at) + ' (72 Stunden).',
    r.hard_expires_at ? 'Hard-Reservierung: Gilt bis ' + fmtDate(r.hard_expires_at) + ' (21 Tage nach Genehmigung).' : '',
    'Reservierungsgebühr: € 1.000,00 (wird auf Provision angerechnet).',
  ].filter(Boolean);
  lines.forEach(l => { doc.text(l, margin, y); y += 6; });
  y += 3;

  if (o.bank_iban) {
    section('Zahlungsanweisung');
    if (o.bank_account_holder) row('Empfänger', o.bank_account_holder);
    if (o.bank_name) row('Bank', o.bank_name);
    row('IBAN', o.bank_iban);
    if (o.bank_bic) row('BIC', o.bank_bic);
    row('Betrag', '€ 1.000,00');
    row('Verwendungszweck', 'Reservierung ' + (o.name||'') + ' – ' + r.buyer_name);
    y += 3;
  }

  // Signature
  section('Unterschrift');
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(80, 80, 80);
  doc.text('Unterzeichnet am ' + fmtDate(new Date().toISOString()) + ' von ' + r.buyer_name, margin, y);
  y += 5;
  if (sigData) {
    try { doc.addImage(sigData, 'PNG', margin, y, 80, 25); } catch(e) {}
    y += 28;
  }
  doc.setDrawColor(26, 39, 68);
  doc.line(margin, y, margin+80, y);
  doc.setFontSize(8);
  doc.setTextColor(120, 120, 120);
  doc.text(r.buyer_name + '  (digitale Unterschrift)', margin, y+4);

  // Footer – neutral
  doc.setFontSize(7);
  doc.setTextColor(160, 160, 160);
  doc.text('Diese Vereinbarung wurde digital unterzeichnet und ist rechtlich bindend.', margin, 285);

  return doc.output('datauristring').split(',')[1];
}

async function submitSignature() {
  if (isCanvasEmpty()) { alert('Bitte unterschreiben Sie zuerst.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  setProgress('⏳ Unterschrift wird gespeichert...');

  const sigData = canvas.toDataURL('image/png');
  const signedAt = new Date().toISOString();

  const { error } = await sb.from('reservations').update({
    signed_at: signedAt,
    signature_data: sigData,
  }).eq('signing_token', token);

  if (error) {
    btn.disabled = false;
    setProgress('');
    alert('Fehler beim Speichern: ' + error.message);
    return;
  }

  setProgress('📄 PDF wird erstellt...');
  const pdfBase64 = generatePDF({...resData, signed_at: signedAt}, sigData);

  setProgress('💾 PDF wird gespeichert...');
  try {
    const pdfBlob = base64ToBlob(pdfBase64, 'application/pdf');
    const fileName = 'Reservierungsvereinbarung_' + (resData.objects?.name||'').replace(/\s/g,'_') + '_' + token.slice(0,8) + '.pdf';
    const pdfPath = token.slice(0,8) + '/' + fileName;
    const { error: upErr } = await sb.storage.from('reservation-pdfs').upload(pdfPath, pdfBlob, { contentType: 'application/pdf', upsert: true });
    if (!upErr) {
      await sb.from('reservations').update({ pdf_path: pdfPath }).eq('signing_token', token);
    }
  } catch(e) { console.error('PDF upload error:', e); }

  setProgress('📄 PDF wird heruntergeladen...');
  try {
    const pdfBlob = base64ToBlob(pdfBase64, 'application/pdf');
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Reservierungsvereinbarung_' + (resData.objects?.name||'').replace(/\s/g,'_') + '.pdf';
    a.click();
    URL.revokeObjectURL(url);
    setProgress('✅ PDF wurde heruntergeladen!');

  }

  }, 2000);
}

function base64ToBlob(base64, mime) {
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function submitProtocolSignature() {
  if (isCanvasEmpty()) { alert('Bitte unterschreiben Sie zuerst.'); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  setProgress('⏳ Unterschrift wird gespeichert...');

  const sigData = canvas.toDataURL('image/png');
  const signedAt = new Date().toISOString();

  const { error } = await sb.from('advisory_protocols').update({
    signed_at: signedAt,
    signature_data: sigData
  }).eq('signing_token', protocolToken);

  if (error) {
    btn.disabled = false;
    setProgress('');
    alert('Fehler beim Speichern: ' + error.message);
    return;
  }

  setProgress('📄 PDF wird erstellt...');
  const pdfBase64 = generateProtocolPDF({...protoData, signed_at: signedAt}, sigData);

  setProgress('💾 PDF wird gespeichert...');
  try {
    const pdfBlob = base64ToBlob(pdfBase64, 'application/pdf');
    const fileName = 'Beratungsprotokoll_' + (protoData.customer_name||'').replace(/\s/g,'_') + '_' + protocolToken.slice(0,8) + '.pdf';
    const pdfPath = 'protocol/' + protocolToken.slice(0,8) + '/' + fileName;
    const { error: upErr } = await sb.storage.from('reservation-pdfs').upload(pdfPath, pdfBlob, { contentType: 'application/pdf', upsert: true });
    if (!upErr) {
      await sb.from('advisory_protocols').update({ pdf_path: pdfPath }).eq('signing_token', protocolToken);
    }
  } catch(e) { console.error('Protocol PDF upload error:', e); }

  setProgress('📄 PDF wird heruntergeladen...');
  try {
    const pdfBlob = base64ToBlob(pdfBase64, 'application/pdf');
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Beratungsprotokoll_' + (protoData.customer_name||'').replace(/\s/g,'_') + '.pdf';
    a.click(); URL.revokeObjectURL(url);
    setProgress('✅ PDF wurde heruntergeladen!');
  } catch(e) { setProgress('⚠️ PDF konnte nicht heruntergeladen werden.'); }

  setTimeout(() => {
    document.getElementById('main').innerHTML = showProtocolSuccess({...protoData, signed_at: signedAt});
  }, 2000);
}

function generateProtocolPDF(p, sigData) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, margin = 18, textW = W - 2 * margin;
  let y = 20;
  const m = p.meta || {};
  const cl = m.checklist || {};
  const goals = m.goals || [];
  const headerName = document.getElementById('headerLogo')?.textContent || 'Vertriebsportal';
  const convDate = p.conversation_date ? new Date(p.conversation_date).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
  const convTime = p.conversation_time ? p.conversation_time.slice(0,5) : '—';
  const convTimeTo = m.time_to ? m.time_to.slice(0,5) : null;
  const timeRange = convTimeTo ? convTime + ' – ' + convTimeTo + ' Uhr' : convTime + ' Uhr';

  function header() {
    doc.setFillColor(26,39,68); doc.rect(0,0,W,28,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(212,175,74);
    doc.text(headerName, margin, 13);
    doc.setFontSize(9); doc.setTextColor(180,180,200);
    doc.text('BERATUNGSPROTOKOLL', margin, 21);
    doc.setFontSize(8); doc.setTextColor(180,180,200);
    doc.text('Nr. ' + protocolToken.slice(0,8).toUpperCase(), W-margin, 21, {align:'right'});
    y = 36;
  }
  function newPage() {
    doc.addPage(); header();
  }
  function checkY(need) { if (y + need > 278) { newPage(); } }
  function section(title) {
    checkY(12);
    doc.setFillColor(240,242,247); doc.rect(margin, y, textW, 6, 'F');
    doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(80,80,110);
    doc.text(title.toUpperCase(), margin+2, y+4.2); y += 10;
  }
  function row(label, val) {
    checkY(8);
    doc.setFontSize(9.5); doc.setFont('helvetica','normal'); doc.setTextColor(100,100,100);
    doc.text(label, margin, y);
    doc.setFont('helvetica','bold'); doc.setTextColor(26,39,68);
    const maxW = textW * 0.48;
    const wrapped = doc.splitTextToSize(String(val||'—'), maxW);
    doc.text(wrapped, W/2, y);
    const h = wrapped.length * 5 + 2;
    doc.setDrawColor(225,225,225); doc.line(margin, y+h-2, W-margin, y+h-2);
    y += h;
  }
  function paraBlock(text) {
    const lines = doc.splitTextToSize(text, textW);
    checkY(lines.length * 5 + 4);
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(50,50,50);
    lines.forEach(l => { checkY(5); doc.text(l, margin, y); y += 5; });
    y += 3;
  }

  header();

  // Title
  doc.setTextColor(26,39,68); doc.setFontSize(18); doc.setFont('helvetica','bold');
  doc.text('Beratungsprotokoll', margin, y); y += 7;
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(120,120,120);
  doc.text('Datum: ' + convDate + '  ·  ' + timeRange + '  ·  Unterzeichnet: ' + fmtDate(new Date().toISOString()), margin, y); y += 10;

  // Gesprächsdaten
  section('Gesprächsdaten');
  row('Datum', convDate);
  row('Uhrzeit', timeRange);
  if (m.location) row('Ort', m.location);
  y += 3;

  // Kundendaten
  section('Kunde / Interessent');
  row('Name', p.customer_name||'—');
  if (m.coapplicant) row('Mitantragsteller', m.coapplicant);
  if (m.address) row('Anschrift', m.address);
  if (p.customer_email) row('E-Mail', p.customer_email);
  if (m.phone) row('Telefon', m.phone);
  y += 3;

  // Berater (from vpProfile stored in global)
  if (vpProfile) {
    section('Berater / Vermittler');
    row('Name', vpProfile.full_name||'—');
    if (vpProfile.company_name) row('Unternehmen', vpProfile.company_name);
    if (vpProfile.email) row('E-Mail', vpProfile.email);
    y += 3;
  }

  // Anlageziele
  if (goals.length || m.risk || m.horizon) {
    section('Anlageziele & Anlegerprofil');
    if (goals.length) row('Anlageziele', goals.join(', '));
    if (m.risk) row('Risikobereitschaft', RISK_LABEL[m.risk]||m.risk);
    if (m.horizon) row('Anlagehorizont', HORIZ_LABEL[m.horizon]||m.horizon);
    y += 3;
  }

  // Checkliste
  section('Checkliste – Aufklärung durch den Berater');
  row('Chancen und Risiken erläutert', (cl.cl1||'ja').toUpperCase());
  row('Exposé und Kaufvertragsentwurf ausgehändigt', (cl.cl2||'ja').toUpperCase());
  row('Bauzeitzinsen und Bereitstellungszinsen erläutert', (cl.cl3||'ja').toUpperCase());
  row('Besichtigung des Objekts angeboten', (cl.cl4||'ja').toUpperCase());
  y += 3;

  // Rechtstext
  section('Aufklärung über Chancen und Risiken');
  paraBlock('Ich/Wir wurde/n vor Erwerb der Immobilie über folgende Punkte ausführlich informiert:');
  paraBlock('Langfristigkeit: Die Immobilie ist als langfristige Vermögensanlage zu sehen. Ein frühzeitiger Verkauf kann hohe Verluste bedeuten.');
  paraBlock('Wertentwicklung: Immobilien bieten weitgehend Schutz gegen Kaufkraftverlust und Inflation. Diese Wertentwicklung unterliegt jedoch Schwankungen. Die beim Kauf anfallenden Nebenkosten sind nicht automatisch durch die Inflation gedeckt.');
  paraBlock('Monatlicher Aufwand: Nach Abzug der zu erwartenden Mieteinnahmen kann der monatliche Gesamtaufwand vor Steuer höher ausfallen.');
  paraBlock('Steuerliches Ergebnis: Die steuerlichen Vorteile erreichen nicht zwingend die Höhe der monatlichen Zahlungen. Die steuerlichen Rahmenbedingungen können sich in Zukunft ändern. Eine Steuerberatung durch einen Steuerberater wird ausdrücklich empfohlen. Weder Bauträger, Vertriebsgesellschaft noch Vermittler haften für die Wirtschaftlichkeit des Immobilienerwerbs.');
  paraBlock('Finanzierung: Das erforderliche Darlehen ist in der Regel höher als der von der Bank ermittelte Verkehrswert. Nach Ablauf der Zinsfestschreibung können die monatlichen Aufwendungen durch Zinsänderungen niedriger oder höher ausfallen. Der Vermittler hat bei der Finanzierung nicht vermittelt.');
  paraBlock('Angabenvorbehalt: Alle Angaben und Berechnungen basieren auf den gemachten Angaben und den zum Zeitpunkt der Erstellung geltenden Vorschriften. Für das Erreichen der wirtschaftlichen und steuerlichen Ziele kann keine Garantie übernommen werden.');
  paraBlock('Nebenabreden: Mündliche Nebenabreden binden niemanden. Der Vermittler ist nicht ermächtigt, verbindliche Aussagen zur Wirtschaftlichkeit zu treffen.');
  y += 2;

  // 12 Punkte
  section('Chancen und Risiken beim Erwerb von Immobilien zur Kapitalanlage');
  const riskPts = [
    'Immobilien als Kapitalanlage sind als langfristige Anlageform zu sehen (Mindesthaltedauer empfohlen: 10 Jahre). Eine Steuerberatung durch den Vermittler findet nicht statt.',
    'Es besteht keine Rücknahmegarantie. Eine positive Wertentwicklung der Immobilie kann nicht garantiert werden.',
    'Steuererstattungen wurden nicht zugesichert. Empfehlung: als zusätzliche Sicherheit ansparen.',
    'Die Eigentümer sind verpflichtet, eine angemessene Instandhaltungsrücklage zu bilden.',
    'Der Vermittler ist ausschließlich zur Vermittlung des Vertragsabschlusses beauftragt. Über den Inhalt der Verkaufsunterlagen hinausgehende Zusagen wurden nicht gemacht.',
    'Das Darlehen ist in der Regel höher als der Verkehrswert. Ein Teil ist durch die persönliche Bonität abgesichert.',
    'Die übergebenen Einkommensnachweise und die Selbstauskunft geben die Vermögens- und Einkommenssituation zutreffend wieder.',
    'Für Konsequenzen aus der laufenden Steuer- und Rechtsprechung wird keine Haftung übernommen.',
    'Das Objekt wurde besichtigt oder eine Besichtigung wurde angeboten; der Zustand ist bekannt.',
    'Rücklagen sollten auch für das Sondereigentum gebildet werden. Die Werthaltigkeit einer Mietgarantie hängt von der Bonität des Garantiegebers ab.',
    'Der Erwerb der Kapitalanlage steht in keinem Zusammenhang mit einem Kreditvertrag.',
    'Die Beratung bezog sich ausschließlich auf das hier genannte Objekt.'
  ];
  riskPts.forEach((pt, i) => paraBlock((i+1) + '. ' + pt));
  y += 2;

  // Schlussbestätigung
  section('Bestätigung des Kunden');
  paraBlock('Ich/Wir bestätige/n, alle genannten Punkte sowie das gesamte Beratungsprotokoll gelesen und verstanden zu haben.');
  paraBlock('Ich/Wir akzeptiere/n die Verarbeitung und Speicherung der angegebenen Daten gemäß Datenschutzrichtlinien.');
  paraBlock('Ich/Wir bestätige/n hiermit den Gesamtinhalt dieses Protokolls sowie die Richtigkeit der darin enthaltenen Angaben. Mündliche Nebenabreden wurden nicht getroffen.');
  y += 4;

  // Unterschrift
  section('Unterschrift Kunde');
  checkY(40);
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
  doc.text('Unterzeichnet am ' + fmtDate(new Date().toISOString()) + ' von ' + (p.customer_name||'Kunde'), margin, y); y += 6;
  if (sigData) { try { doc.addImage(sigData, 'PNG', margin, y, 80, 25); } catch(e) {} y += 28; }
  doc.setDrawColor(26,39,68); doc.line(margin, y, margin+90, y); y += 5;
  doc.setFontSize(8); doc.setTextColor(120,120,120);
  doc.text((p.customer_name||'Kunde') + '   (digitale Unterschrift)', margin, y);

  doc.setFontSize(7); doc.setTextColor(160,160,160);
  doc.text('Digital unterzeichnet und rechtlich bindend. Erstellt durch ' + headerName + '.', margin, 288);

  return doc.output('datauristring').split(',')[1];
}

function showProtocolSuccess(p) {
  const convDate = p.conversation_date ? new Date(p.conversation_date).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}) : '';
  return `
    <div class="success">
      <div class="success-icon">✅</div>
      <div class="success-title">Beratungsprotokoll unterzeichnet!</div>
      <div class="success-text">
        Vielen Dank, <strong>${p.customer_name||'Kunde'}</strong>.<br>
        Sie haben den Erhalt der Risikohinweise vom <strong>${convDate}</strong> digital bestätigt.<br><br>
        Das PDF wurde auf Ihr Gerät heruntergeladen.<br>
        Ihr Berater erhält eine Benachrichtigung.
      </div>
    </div>`;
}

load();
